version: "3.9"

services:
  atsss:
    image: atsss:latest
    build:
        context: .
        args:
          ENABLE_PRINT: ${ENABLE_PRINT}
    container_name: atsss-aue
    command: uvicorn aue:app --host ${AUE_API_IP} --port 8101
    env_file:
      - .env
    network_mode: host
    tty: true
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /tmp:/tmp
