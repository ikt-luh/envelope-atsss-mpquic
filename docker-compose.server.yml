version: "3.9"

services:
  atsss:
    image: atsss:latest
    build:
        context: .
        args:
          ENABLE_PRINT: ${ENABLE_PRINT}
    container_name: atsss-server
    command: python3 server.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    network_mode: host
    privileged: true
    tty: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    volumes:
      - /tmp:/tmp
