version: "3.9"

services:
  atsss:
    image: atsss:latest
    build:
        context: .
        args:
          ENABLE_PRINT: ${ENABLE_PRINT}
    container_name: atsss-ane
    command: uvicorn ane:app --host ${ANE_API_IP} --port 8102
    env_file:
      - .env
    network_mode: host
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
